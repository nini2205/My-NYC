<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My NYC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.4.0/dist/tabler-icons.min.css" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --paper: #FDFAF4;
  --paper2: #F7F2E8;
  --paper3: #EFE8D8;
  --ink: #2C2416;
  --ink2: #6B5E48;
  --ink3: #A8967C;
  --squiggle: #2C2416;
  --c1: #F4C4A0; /* peach */
  --c2: #B8DDB8; /* sage */
  --c3: #B8D4F0; /* sky */
  --c4: #E8C4E0; /* lilac */
  --c1d: #7A4020;
  --c2d: #2A5C2A;
  --c3d: #1A4878;
  --c4d: #6A2868;
}

body {
  font-family: 'Nunito', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  background-image:
    radial-gradient(circle at 15% 20%, rgba(244,196,160,0.18) 0%, transparent 45%),
    radial-gradient(circle at 85% 70%, rgba(184,212,240,0.18) 0%, transparent 45%),
    radial-gradient(circle at 50% 90%, rgba(232,196,224,0.15) 0%, transparent 40%);
}

/* squiggly border via svg filter */
.squig { filter: url(#squiggle); }

/* HEADER */
.hero {
  padding: 2.5rem 1.5rem 0;
  text-align: center;
  position: relative;
}
.hero-doodles {
  position: absolute;
  top: 0; left: 0; right: 0;
  pointer-events: none;
  overflow: hidden;
  height: 100%;
}
.hero h1 {
  font-family: 'Caveat', cursive;
  font-size: clamp(52px, 12vw, 90px);
  font-weight: 700;
  color: var(--ink);
  line-height: 1;
  letter-spacing: -0.01em;
  position: relative;
  display: inline-block;
}
.hero h1 .nyc {
  color: #C4622D;
  display: inline-block;
  transform: rotate(-2deg);
  transform-origin: center bottom;
}
.hero-sub {
  font-family: 'Caveat', cursive;
  font-size: 20px;
  color: var(--ink3);
  margin-top: 4px;
  transform: rotate(-0.5deg);
  display: inline-block;
}
.hero-count {
  display: inline-block;
  background: var(--ink);
  color: var(--paper);
  font-family: 'Caveat', cursive;
  font-size: 16px;
  padding: 3px 14px;
  border-radius: 999px;
  margin-top: 10px;
  transform: rotate(1deg);
}
.hero-bottom {
  margin-top: 1.25rem;
  display: flex;
  justify-content: center;
}

/* wavy SVG divider */
.wave-divider { width: 100%; overflow: hidden; line-height: 0; margin-top: -2px; }
.wave-divider svg { display: block; width: 100%; }

/* ADD BUTTON */
.add-btn {
  font-family: 'Caveat', cursive;
  font-size: 22px;
  font-weight: 700;
  background: var(--ink);
  color: var(--paper);
  border: none;
  border-radius: 999px;
  padding: 10px 28px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  position: relative;
  transition: transform 0.15s;
  box-shadow: 4px 4px 0 rgba(44,36,22,0.15);
}
.add-btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 rgba(44,36,22,0.18); }
.add-btn:active { transform: translate(1px, 1px); box-shadow: 2px 2px 0 rgba(44,36,22,0.12); }

/* MAIN */
.main {
  max-width: 880px;
  margin: 0 auto;
  padding: 1.5rem 1.25rem 4rem;
}

/* SEARCH */
.search-wrap {
  position: relative;
  margin-bottom: 1.25rem;
}
.search-wrap i {
  position: absolute;
  left: 14px; top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  color: var(--ink3);
  pointer-events: none;
}
.search-wrap input {
  width: 100%;
  padding: 13px 16px 13px 44px;
  background: white;
  border: 2.5px solid var(--ink);
  border-radius: 999px;
  font-size: 16px;
  font-family: 'Nunito', sans-serif;
  color: var(--ink);
  outline: none;
  box-shadow: 3px 3px 0 rgba(44,36,22,0.12);
  transition: box-shadow 0.15s, transform 0.15s;
}
.search-wrap input::placeholder { color: var(--ink3); font-style: italic; }
.search-wrap input:focus {
  box-shadow: 4px 4px 0 rgba(44,36,22,0.18);
  transform: translate(-1px, -1px);
}

/* TABS */
.tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
  align-items: center;
}
.tabs-label {
  font-family: 'Caveat', cursive;
  font-size: 18px;
  color: var(--ink3);
  margin-right: 4px;
}
.tab {
  font-family: 'Caveat', cursive;
  font-size: 18px;
  font-weight: 600;
  padding: 6px 18px;
  border-radius: 999px;
  cursor: pointer;
  border: 2px solid var(--ink);
  color: var(--ink);
  background: white;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 2px 2px 0 rgba(44,36,22,0.1);
}
.tab:hover:not(.active) { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 rgba(44,36,22,0.12); }
.tab.active { background: var(--ink); color: var(--paper); box-shadow: 3px 3px 0 rgba(44,36,22,0.2); }
.cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid rgba(0,0,0,0.15); }

/* CARDS */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
  gap: 16px;
}

.card {
  background: white;
  border: 2.5px solid var(--ink);
  border-radius: 18px;
  padding: 1.25rem;
  position: relative;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 4px 4px 0 rgba(44,36,22,0.12);
}
.card:nth-child(3n+1) { transform: rotate(-0.5deg); }
.card:nth-child(3n+2) { transform: rotate(0.4deg); }
.card:nth-child(3n+3) { transform: rotate(-0.3deg); }
.card:hover { transform: rotate(0deg) translate(-2px,-2px) !important; box-shadow: 6px 6px 0 rgba(44,36,22,0.15); }

/* colored top strip per category */
.card-strip {
  position: absolute;
  top: 0; left: 16px; right: 16px;
  height: 5px;
  border-radius: 999px;
  margin-top: -1px;
}

.card-top { margin-top: 10px; margin-bottom: 8px; }
.card-name {
  font-family: 'Caveat', cursive;
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.2;
  padding-right: 52px;
}
.card-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 700;
  font-family: 'Nunito', sans-serif;
  padding: 3px 10px;
  border-radius: 999px;
  border: 1.5px solid rgba(0,0,0,0.1);
  margin-top: 5px;
  letter-spacing: 0.03em;
}

.card-actions {
  position: absolute;
  top: 14px; right: 14px;
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.15s;
}
.card:hover .card-actions { opacity: 1; }
.icon-btn {
  background: var(--paper2);
  border: 1.5px solid var(--ink);
  cursor: pointer;
  color: var(--ink2);
  width: 30px; height: 30px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  transition: all 0.1s;
}
.icon-btn:hover { background: var(--ink); color: var(--paper); }
.icon-btn.del:hover { background: #F4C4A0; color: var(--c1d); border-color: var(--c1d); }

.card-divider {
  border: none;
  border-top: 1.5px dashed var(--paper3);
  margin: 10px 0;
}

.card-row {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  font-size: 13.5px;
  color: var(--ink2);
  margin-bottom: 5px;
  line-height: 1.4;
}
.card-row i { font-size: 14px; color: var(--ink3); flex-shrink: 0; margin-top: 1px; }
.card-row a { color: var(--ink2); text-decoration: underline; text-decoration-color: var(--ink3); text-underline-offset: 2px; }
.card-row a:hover { color: #C4622D; }

.card-notes { font-size: 13.5px; color: var(--ink2); line-height: 1.55; font-style: italic; }

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1.5px dashed var(--paper3);
}
.card-price {
  font-family: 'Caveat', cursive;
  font-size: 18px;
  font-weight: 700;
  color: var(--ink3);
}
.card-link {
  font-size: 13px;
  font-weight: 700;
  color: #C4622D;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 4px;
  font-family: 'Nunito', sans-serif;
}
.card-link:hover { text-decoration: underline; }

/* EMPTY */
.empty {
  grid-column: 1/-1;
  text-align: center;
  padding: 5rem 1rem;
  color: var(--ink3);
}
.empty-icon {
  font-size: 48px;
  display: block;
  margin-bottom: 16px;
  opacity: 0.4;
}
.empty-title {
  font-family: 'Caveat', cursive;
  font-size: 28px;
  color: var(--ink2);
  margin-bottom: 6px;
}
.empty-sub { font-size: 15px; font-style: italic; }

/* MODAL */
.modal-bg {
  position: fixed;
  inset: 0;
  background: rgba(44,36,22,0.45);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 5vh 1rem 2rem;
  z-index: 100;
  overflow-y: auto;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--paper);
  border: 2.5px solid var(--ink);
  border-radius: 24px;
  padding: 1.75rem;
  width: 100%;
  max-width: 460px;
  box-shadow: 6px 6px 0 rgba(44,36,22,0.18);
  position: relative;
}
.modal-title {
  font-family: 'Caveat', cursive;
  font-size: 30px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 1.25rem;
}
.field { margin-bottom: 13px; }
.field label {
  display: block;
  font-family: 'Caveat', cursive;
  font-size: 17px;
  font-weight: 600;
  color: var(--ink2);
  margin-bottom: 4px;
}
.field input, .field select, .field textarea {
  width: 100%;
  background: white;
  color: var(--ink);
  border: 2px solid var(--ink);
  border-radius: 10px;
  padding: 9px 13px;
  font-size: 15px;
  font-family: 'Nunito', sans-serif;
  outline: none;
  box-shadow: 2px 2px 0 rgba(44,36,22,0.1);
  transition: box-shadow 0.15s;
}
.field input::placeholder, .field textarea::placeholder { color: var(--ink3); font-style: italic; }
.field input:focus, .field select:focus, .field textarea:focus {
  box-shadow: 3px 3px 0 rgba(44,36,22,0.15);
}
.field textarea { height: 78px; resize: vertical; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 1.5rem; align-items: center; }
.cancel-btn {
  font-family: 'Caveat', cursive;
  font-size: 20px;
  background: none;
  border: 2px solid var(--ink);
  border-radius: 999px;
  padding: 7px 20px;
  cursor: pointer;
  color: var(--ink2);
  transition: all 0.15s;
}
.cancel-btn:hover { background: var(--paper3); }

/* sticker decorations */
.sticker {
  position: absolute;
  font-family: 'Caveat', cursive;
  font-size: 13px;
  font-weight: 700;
  transform: rotate(-8deg);
  opacity: 0.6;
  pointer-events: none;
  color: var(--ink3);
  user-select: none;
}

@media (max-width: 580px) {
  .main { padding: 1.25rem 1rem 3rem; }
  .cards { grid-template-columns: 1fr; }
  .field-row { grid-template-columns: 1fr; }
  .card:nth-child(n) { transform: none; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="squiggle" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.065" numOctaves="3" seed="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<!-- little floating doodles -->
<div style="position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:0">
  <div style="position:absolute;top:8%;left:4%;font-size:28px;opacity:0.07;transform:rotate(-15deg);font-family:'Caveat',cursive">★</div>
  <div style="position:absolute;top:15%;right:6%;font-size:22px;opacity:0.07;transform:rotate(10deg);font-family:'Caveat',cursive">♥</div>
  <div style="position:absolute;top:40%;left:2%;font-size:18px;opacity:0.06;transform:rotate(-5deg);font-family:'Caveat',cursive">✦</div>
  <div style="position:absolute;bottom:20%;right:4%;font-size:24px;opacity:0.06;transform:rotate(8deg);font-family:'Caveat',cursive">◆</div>
  <div style="position:absolute;bottom:10%;left:8%;font-size:20px;opacity:0.06;transform:rotate(-12deg);font-family:'Caveat',cursive">★</div>
</div>

<div style="position:relative;z-index:1">

<div class="hero">
  <div style="margin-bottom:6px">
    <span style="font-family:'Caveat',cursive;font-size:18px;color:var(--ink3);transform:rotate(-1deg);display:inline-block">✦ a little list of</span>
  </div>
  <h1>My <span class="nyc">NYC</span></h1>
  <div class="hero-sub">places i love & want to try 🗽</div>
  <div style="margin-top:12px">
    <span class="hero-count" id="hero-count">0 spots saved</span>
  </div>
  <div class="hero-bottom" style="margin-top:1.25rem;padding-bottom:2rem">
    <button class="add-btn" onclick="openAdd()">
      <i class="ti ti-plus" aria-hidden="true"></i> add a spot
    </button>
  </div>
</div>

<!-- wavy divider -->
<div class="wave-divider">
  <svg viewBox="0 0 1440 40" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" style="height:40px">
    <path d="M0,20 C120,35 240,5 360,20 C480,35 600,5 720,20 C840,35 960,5 1080,20 C1200,35 1320,5 1440,20 L1440,40 L0,40 Z" fill="#FDFAF4"/>
    <path d="M0,20 C120,35 240,5 360,20 C480,35 600,5 720,20 C840,35 960,5 1080,20 C1200,35 1320,5 1440,20" stroke="#2C2416" stroke-width="2" fill="none" opacity="0.12"/>
  </svg>
</div>

<div class="main">
  <div class="search-wrap">
    <i class="ti ti-search" aria-hidden="true"></i>
    <input type="text" id="search-input" placeholder="search your spots…" oninput="render()" />
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="cards" id="cards-grid"></div>
</div>

</div>

<div id="modal-container"></div>

<script>
const CATS = {
  Eat:     { color: '#C4622D', bg: '#F4C4A0', text: '#7A3418' },
  Drink:   { color: '#9B5EA2', bg: '#E8C4E0', text: '#6A2868' },
  Shop:    { color: '#2D7A9B', bg: '#B8D4F0', text: '#1A4878' },
  Explore: { color: '#2D7A5A', bg: '#B8DDB8', text: '#2A5C2A' },
};
const ALL_CATS = ['All', ...Object.keys(CATS)];
const CAT_EMOJI = { Eat: '🍜', Drink: '🍹', Shop: '🛍️', Explore: '📍' };

let places = [];
let filter = 'All';
let editId = null;

function loadPlaces() {
  try { places = JSON.parse(localStorage.getItem('mynyc_v2') || '[]'); } catch(e) { places = []; }
  render();
}
function savePlaces() { localStorage.setItem('mynyc_v2', JSON.stringify(places)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function render() {
  renderTabs();
  renderCards();
  const n = places.length;
  document.getElementById('hero-count').textContent = n === 0 ? 'nothing saved yet!' : `${n} spot${n===1?'':'s'} saved ✓`;
}

function renderTabs() {
  document.getElementById('tabs').innerHTML =
    `<span class="tabs-label">show:</span>` +
    ALL_CATS.map(c => {
      const cat = CATS[c];
      const dot = cat ? `<span class="cat-dot" style="background:${cat.bg};border-color:${cat.color}40"></span>` : '';
      const cnt = c === 'All' ? places.length : places.filter(p => p.category === c).length;
      const emoji = CAT_EMOJI[c] || '';
      return `<button class="tab ${filter===c?'active':''}" onclick="setFilter('${c}')">${dot}${emoji ? emoji+' ' : ''}${c} <span style="opacity:0.5;font-size:15px">${cnt}</span></button>`;
    }).join('');
}

function renderCards() {
  const grid = document.getElementById('cards-grid');
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  let shown = filter === 'All' ? [...places] : places.filter(p => p.category === filter);
  if (q) shown = shown.filter(p => [p.name,p.neighborhood,p.address,p.notes,p.category].some(f=>(f||'').toLowerCase().includes(q)));

  if (!shown.length) {
    grid.innerHTML = `<div class="empty">
      <span class="empty-icon">🗺️</span>
      <div class="empty-title">${q ? 'hmm, nothing found!' : filter !== 'All' ? 'no '+filter.toLowerCase()+' yet!' : 'so empty in here!'}</div>
      <div class="empty-sub">${q ? 'try searching something else?' : 'add your first spot above ↑'}</div>
    </div>`;
    return;
  }

  grid.innerHTML = shown.map(p => {
    const cat = CATS[p.category] || CATS.Explore;
    const mapsUrl = p.address ? `https://maps.google.com/?q=${encodeURIComponent(p.address+' New York')}` : null;
    const emoji = CAT_EMOJI[p.category] || '📍';
    const hasFooter = p.price || p.website;
    return `<div class="card">
      <div class="card-strip" style="background:${cat.bg}"></div>
      <div class="card-actions">
        <button class="icon-btn" onclick="openEdit('${p.id}')" aria-label="Edit"><i class="ti ti-edit" aria-hidden="true"></i></button>
        <button class="icon-btn del" onclick="deletePlace('${p.id}')" aria-label="Delete"><i class="ti ti-trash" aria-hidden="true"></i></button>
      </div>
      <div class="card-top">
        <div class="card-name">${esc(p.name)}</div>
        <span class="card-badge" style="background:${cat.bg};color:${cat.text}">${emoji} ${p.category}</span>
      </div>
      ${(p.neighborhood||p.address) ? `<hr class="card-divider">` : ''}
      ${p.neighborhood ? `<div class="card-row"><i class="ti ti-map-pin" aria-hidden="true"></i>${esc(p.neighborhood)}</div>` : ''}
      ${p.address ? `<div class="card-row"><i class="ti ti-route" aria-hidden="true"></i><a href="${mapsUrl}" target="_blank" rel="noopener">${esc(p.address)}</a></div>` : ''}
      ${p.notes ? `<hr class="card-divider"><div class="card-notes">${esc(p.notes)}</div>` : ''}
      ${hasFooter ? `<div class="card-footer">
        <div class="card-price">${esc(p.price||'')}</div>
        ${p.website ? `<a class="card-link" href="${esc(p.website)}" target="_blank" rel="noopener"><i class="ti ti-external-link" style="font-size:13px"></i> visit</a>` : ''}
      </div>` : ''}
    </div>`;
  }).join('');
}

function setFilter(c) { filter = c; render(); }

function deletePlace(id) {
  if (!confirm('remove this spot? 🥺')) return;
  places = places.filter(p => p.id !== id);
  savePlaces(); render();
}

function openAdd() { editId = null; showModal(); }
function openEdit(id) { editId = id; showModal(places.find(p => p.id === id)); }

function showModal(data) {
  const isEdit = !!data;
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-title">${isEdit ? '✏️ edit spot' : '✦ add a spot'}</div>
        <div class="field"><label>name</label><input id="f-name" value="${esc(data?.name||'')}" placeholder="Raku, The Strand, Superiority Burger…" /></div>
        <div class="field-row">
          <div class="field"><label>category</label><select id="f-cat">${Object.keys(CATS).map(c=>`<option value="${c}"${data?.category===c?' selected':''}>${CAT_EMOJI[c]} ${c}</option>`).join('')}</select></div>
          <div class="field"><label>price</label><select id="f-price">${['','$','$$','$$$','$$$$'].map(p=>`<option value="${p}"${data?.price===p?' selected':''}>${p||'—'}</option>`).join('')}</select></div>
        </div>
        <div class="field-row">
          <div class="field"><label>neighborhood</label><input id="f-nbhd" value="${esc(data?.neighborhood||'')}" placeholder="East Village…" /></div>
          <div class="field"><label>address</label><input id="f-addr" value="${esc(data?.address||'')}" placeholder="123 Mott St…" /></div>
        </div>
        <div class="field"><label>notes</label><textarea id="f-notes" placeholder="why you love it, what to order, vibes…">${esc(data?.notes||'')}</textarea></div>
        <div class="field"><label>website or instagram</label><input id="f-web" value="${esc(data?.website||'')}" placeholder="https://…" /></div>
        <div class="modal-actions">
          <button class="cancel-btn" onclick="closeModal()">cancel</button>
          <button class="add-btn" onclick="saveModal()">${isEdit ? '✓ save' : '+ add it'}</button>
        </div>
      </div>
    </div>`;
  setTimeout(() => document.getElementById('f-name')?.focus(), 50);
}

function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

function saveModal() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('give it a name! 🙂'); return; }
  const obj = {
    id: editId || uid(),
    name,
    category: document.getElementById('f-cat').value,
    neighborhood: document.getElementById('f-nbhd').value.trim(),
    address: document.getElementById('f-addr').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
    website: document.getElementById('f-web').value.trim(),
    price: document.getElementById('f-price').value
  };
  if (editId) { places = places.map(p => p.id === editId ? obj : p); }
  else { places.push(obj); }
  savePlaces(); closeModal(); render();
}

loadPlaces();
</script>
</body>
</html>
